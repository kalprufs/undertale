<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Room test</title>
<style>
  @font-face {
    font-family: 'Determination';
    src: url('font/DeterminationMonoWebRegular-Z5oq.ttf');
  }
  html, body { margin:0; height:100%; background:#000;
               display:flex; align-items:center; justify-content:center; }
  canvas { max-width:100vw; max-height:100vh; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const SPEED       = 4;    // pixels per frame (in room pixels)
const FRAME_TICKS = 8;    // lower = faster walk animation
const FEET_HALF_W = 12;   // half the width of her "feet box"
const BLOCKER_PAD = 6;    // extra space around furniture so she doesn't touch the edge
const REACH       = 12;   // how far past her stopping point she can interact
const TEXT_TICKS  = 2;    // frames per typed letter (lower = faster typing)
const FADE_FRAMES = 10;   // length of the fade when changing rooms

const SAMPLE = ['Here is a sample text.'];

// ======================= ROOMS =======================
// native  = true: the screen is exactly the size of the room (whole room visible, no camera)
//           false: the screen is the size of the Frisk room and the camera follows her
// zoom    = how much the room is enlarged on screen
// spriteH = how tall she is drawn in ROOM pixels
// floor   = where her feet can be
// blockers: solid = can't walk through (default). solid:false = interact only.
//           text = pages of dialogue, reach = extra interaction distance
// exits   = walk into the zone to go to another room (x, y, dir = where she appears)
//           an exit with todo + back is a room that isn't made yet: it shows the text and sends her back
const ROOMS = {

  frisk: {
    img: 'frisk_room', native: true, zoom: 1, spriteH: 120,
    floor: [
      { x1: 85,  x2: 789, y1: 240, y2: 705 },  // main room
      { x1: 597, x2: 741, y1: 700, y2: 779 },  // hallway
    ],
    blockers: [
      { name: 'lamp', x1: 79, x2: 151, y1: 136, y2: 290, text: [
          "A lamp, left on for a kid.",
          "It's the warmest thing in the room. Besides the guilt."
      ]},
      { name: 'box by closet', x1: 211, x2: 283, y1: 202, y2: 258, text: SAMPLE },
      { name: 'small closet', x1: 287, x2: 443, y1: 136, y2: 291, text: [
          "Books and little toys, arranged with care.",
          "It took a lot of effort to make this room.",
          "It would have taken one word to save the person who made it."
      ]},
      { name: 'big closet', x1: 467, x2: 591, y1: 104.5, y2: 314, text: [
          "One sweater, your size."
      ]},
      { name: 'bed', x1: 615, x2: 791, y1: 238, y2: 454, text: [
          "A small, neatly made bed.",
          "A slice of pie is waiting if you sleep.",
          "You don't deserve it. You can't sleep."
      ]},
      { name: 'toy box', x1: 691, x2: 791, y1: 458, y2: 522, text: [
          "A box of toys. Watching you. Even they know."
      ]},
      { name: 'wall frame', x1: 183, x2: 251, y1: 102, y2: 190, reach: 70, text: [
          "A drawing of a flower. A golden one, of course.",
          "This game keeps coming back to flowers, and to you."
      ]},
    ],
    exits: [
      { x1: 597, x2: 741, y1: 772, y2: 820, to: 'hallway', x: 340, y: 170, dir: 'down' },
    ],
  },

  hallway: {
    img: 'hallway', native: false, zoom: 1.6, spriteH: 75,
    floor: [
      { x1: 6, x2: 1443, y1: 155, y2: 261 },
    ],
    mirror: { x1: 1288.97, x2: 1386.98, y1: 69.03, y2: 118.98 },
    blockers: [
      { name: 'mirror',         x1: 1288.97, x2: 1386.98, y1: 69.03, y2: 118.98, solid: false, reach: 40, text: SAMPLE },
      { name: 'flower vase 1',  x1: 1422.87, x2: 1447.06, y1: 62.92, y2: 165.12, text: SAMPLE },
      { name: 'door',           x1: 1143.10, x2: 1209.08, y1: 55.06, y2: 148.96, text: SAMPLE },
      { name: 'nightstand 1',   x1: 1085.07, x2: 1133.00, y1: 76.78, y2: 163.08, text: SAMPLE },
      { name: 'flower vase 2',  x1: 665.01,  x2: 706.98,  y1: 72.58, y2: 171.12, text: SAMPLE },
      { name: 'frame',          x1: 495.06,  x2: 593.01,  y1: 52.92, y2: 103.01, solid: false, reach: 60, text: SAMPLE },
      { name: 'nightstand 2',   x1: 464.97,  x2: 513.29,  y1: 77.04, y2: 163.00, text: SAMPLE },
      { name: 'flower vase 3',  x1: 437.07,  x2: 460.99,  y1: 63.03, y2: 165.03, text: SAMPLE },
    ],
    exits: [
      // door to the Frisk room: walk up into it
      { x1: 307.05, x2: 372.94, y1: 140, y2: 160, to: 'frisk',    x: 669,  y: 752, dir: 'up' },
      // door to Toriel's room: walk up into it
      { x1: 724.98, x2: 791.03, y1: 140, y2: 160, to: 'toriel',   x: 343,  y: 890, dir: 'up' },
      // the far left end leads into the main hall
      { x1: 0,      x2: 30,     y1: 150, y2: 265, to: 'mainhall', x: 1075, y: 700, dir: 'left' },
    ],
  },

  toriel: {
    img: 'toriel_room', native: true, zoom: 1, spriteH: 120,
    floor: [
      { x1: 75,  x2: 859, y1: 241, y2: 845 },  // main room
      { x1: 271, x2: 415, y1: 840, y2: 923 },  // entrance
    ],
    blockers: [
      { name: 'cactus',     x1: 740.84, x2: 861.30, y1: 655.08, y2: 843.07, text: SAMPLE },
      { name: 'closet',     x1: 644.89, x2: 861.00, y1: 202.80, y2: 327.01, text: SAMPLE },
      { name: 'shelf',      x1: 396.98, x2: 637.02, y1: 11.01,  y2: 343.13, text: SAMPLE },
      { name: 'bed flower', x1: 320.99, x2: 385.00, y1: 138.94, y2: 347.00, text: SAMPLE },
      { name: 'bed',        x1: 96.99,  x2: 309.01, y1: 246.98, y2: 543.22, text: SAMPLE },
      { name: 'chair',      x1: 248.96, x2: 317.03, y1: 558.77, y2: 671.15, text: SAMPLE },
      { name: 'diary',      x1: 89.09,  x2: 228.82, y1: 550.99, y2: 759.17, text: SAMPLE },
      { name: 'bin',        x1: 144.95, x2: 213.16, y1: 763.03, y2: 843.03, text: SAMPLE },
    ],
    exits: [
      { x1: 271, x2: 415, y1: 915, y2: 960, to: 'hallway', x: 758, y: 170, dir: 'down' },
    ],
  },

  mainhall: {
    img: 'mainhall', native: true, zoom: 1, spriteH: 120,
    floor: [
      { x1: 82,   x2: 1046, y1: 241, y2: 861 },  // main room
      { x1: 1040, x2: 1123, y1: 589, y2: 813 },  // entrance to the hallway (right)
      { x1: 490,  x2: 630,  y1: 855, y2: 941 },  // entrance to outside Toriel's (bottom)
      { x1: 6,    x2: 88,   y1: 589, y2: 813 },  // entrance to the living room (left)
    ],
    blockers: [
      { name: 'staircase',   x1: 195.97, x2: 828.19,  y1: 210.93, y2: 559.08, text: SAMPLE },
      { name: 'main shelf',  x1: 891.98, x2: 1048.02, y1: 186.98, y2: 282.91, text: SAMPLE },
      { name: 'table flower', x1: 83.86, x2: 180.04,  y1: 54.77,  y2: 315.16, text: SAMPLE },
    ],
    exits: [
      // right: back to the hallway (comes out at its far left end)
      { x1: 1100, x2: 1140, y1: 583, y2: 819, to: 'hallway', x: 45, y: 208, dir: 'right' },
      // bottom: outside Toriel's house (not made yet)
      { x1: 484,  x2: 636,  y1: 925, y2: 960, to: 'outside', todo: "(This leads outside Toriel's house. Not made yet.)",
        back: { x: 560, y: 800, dir: 'up' } },
      // left: living room (not made yet)
      { x1: 0,    x2: 40,   y1: 583, y2: 819, to: 'livingroom', todo: "(This leads to the living room. Not made yet.)",
        back: { x: 130, y: 700, dir: 'right' } },
    ],
  },
};

const files = {
  frisk_room:  'frisk_room.png',
  hallway:     'hallway.png',
  toriel_room: 'toriel_room.png',
  mainhall:    'mainhall.png',
  walk_down:  'sprites/walk_down.png',  walk_up:    'sprites/walk_up.png',
  walk_left:  'sprites/walk_left.png',  walk_right: 'sprites/walk_right.png',
  stand_down: 'sprites/stand_down.png', stand_up:   'sprites/stand_up.png',
  stand_left: 'sprites/stand_left.png', stand_right:'sprites/stand_right.png',
};

const DIRS = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const imgs = {};
const keys = {};
let debug = false;
let W = 0, H = 0;            // the current SCREEN size
let VIEW_W = 0, VIEW_H = 0;  // the size of the Frisk room (used by rooms with a camera)
let room = null;     // the current room
let p = null;        // the player
let dialog = null;   // the open text box, or null
let fade = null;     // room-change fade, or null
let lastProbe = null;

function load(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(src);
    i.src = src;
  });
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const inside = (r, x, y) => x >= r.x1 && x <= r.x2 && y >= r.y1 && y <= r.y2;
const padded = b => ({ x1: b.x1 - BLOCKER_PAD, x2: b.x2 + BLOCKER_PAD,
                       y1: b.y1 - BLOCKER_PAD, y2: b.y2 + BLOCKER_PAD });

function canStand(x, y) {
  for (const dx of [-FEET_HALF_W, FEET_HALF_W]) {
    const px = x + dx;
    if (!room.floor.some(r => inside(r, px, y))) return false;
    if (room.blockers.some(b => b.solid !== false && inside(padded(b), px, y))) return false;
  }
  return true;
}

// Look in the direction she's facing and return the nearest object in reach
function findInteraction() {
  const [dx, dy] = DIRS[p.dir];
  const horizontal = dx !== 0;
  const base = (horizontal ? FEET_HALF_W : 0) + BLOCKER_PAD + REACH;
  const maxD = base + Math.max(0, ...room.blockers.map(b => b.reach || 0));
  const sideOffsets = [-10, 0, 10];
  for (let d = 0; d <= maxD; d += 3) {
    for (const s of sideOffsets) {
      const px = p.x + dx * d + (horizontal ? 0 : s);
      const py = p.y + dy * d + (horizontal ? s : 0);
      for (const b of room.blockers) {
        if (d <= base + (b.reach || 0) && inside(b, px, py)) {
          lastProbe = { x: px, y: py };
          return b;
        }
      }
    }
  }
  return null;
}

// ---------- camera ----------
// Returns where the room's top-left corner is on the screen.
// Rooms smaller than the screen are centered (black bars); bigger ones follow her.
function cameraOffset() {
  const z = room.zoom;
  const rw = imgs[room.img].width * z, rh = imgs[room.img].height * z;
  const ox = rw <= W ? (W - rw) / 2 : -clamp(p.x * z - W / 2, 0, rw - W);
  const oy = rh <= H ? (H - rh) / 2 : -clamp((p.y - room.spriteH / 2) * z - H / 2, 0, rh - H);
  return { ox: Math.round(ox), oy: Math.round(oy) };
}

// ---------- changing rooms ----------
function enterRoom(name, x, y, dir) {
  room = ROOMS[name];
  const img = imgs[room.img];
  W = room.native ? img.width  : VIEW_W;
  H = room.native ? img.height : VIEW_H;
  canvas.width = W; canvas.height = H;     // (this also resets the canvas settings)
  ctx.imageSmoothingEnabled = false;
  p.x = x; p.y = y; p.dir = dir;
  p.moving = false; p.frame = 0; p.tick = 0;
  dialog = null;
}

function startTransition(exit) { fade = { phase: 'out', t: 0, exit }; }

// ---------- dialogue box (drawn on the screen, not affected by the camera) ----------
function dlgMetrics() {
  const k = Math.max(0.55, Math.min(1, H / 785));
  const margin = Math.round(30 * k);
  const bw = Math.min(W - margin * 2, 810);
  return { margin, bw, bx: Math.round((W - bw) / 2), by: margin, bh: Math.round(200 * k),
           border: Math.max(3, Math.round(6 * k)),
           font: Math.round(36 * k) + 'px Determination, monospace',
           padX: 36 * k, base: 62 * k, lineH: 48 * k };
}

function wrapText(text, maxW, font) {
  ctx.font = font;
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const trial = cur ? cur + ' ' + w : w;
    if (ctx.measureText('* ' + trial).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = trial;
  }
  if (cur) lines.push(cur);
  return lines.map((l, i) => (i === 0 ? '* ' : '  ') + l);
}

function loadPage() {
  const m = dlgMetrics();
  dialog.lines = wrapText(dialog.pages[dialog.page], m.bw - m.padX * 2, m.font);
  dialog.total = dialog.lines.join('').length;
  dialog.shown = 0;
  dialog.tick = 0;
}

function openDialog(pages) {
  dialog = { pages, page: 0 };
  loadPage();
}

function pressConfirm() {
  if (!p || !room || fade) return;
  if (dialog) {
    if (dialog.shown < dialog.total) dialog.shown = dialog.total;        // finish typing
    else if (dialog.page < dialog.pages.length - 1) { dialog.page++; loadPage(); }
    else dialog = null;                                                  // close
    return;
  }
  const hit = findInteraction();
  if (hit) openDialog(hit.text);
}

function drawDialog() {
  const m = dlgMetrics();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(m.bx, m.by, m.bw, m.bh);
  ctx.fillStyle = '#000000';
  ctx.fillRect(m.bx + m.border, m.by + m.border, m.bw - m.border * 2, m.bh - m.border * 2);

  ctx.font = m.font;
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'alphabetic';
  let left = dialog.shown;
  dialog.lines.forEach((line, i) => {
    if (left <= 0) return;
    const part = line.slice(0, left);
    left -= line.length;
    ctx.fillText(part, m.bx + m.padX, m.by + m.base + i * m.lineH);
  });
}

// ---------- sprites ----------
function spriteFrame(dir) {
  let img, sx = 0, sw, sh;
  if (p.moving) {
    img = imgs['walk_' + dir];
    sw = img.width / 4; sh = img.height; sx = p.frame * sw;
  } else {
    img = imgs['stand_' + dir];
    sw = img.width; sh = img.height;
  }
  return { img, sx, sw, sh };
}

// Her reflection in the mirror: only shows when she's in front of it
function drawReflection() {
  const m = room.mirror;
  if (!m) return;
  if (p.x < m.x1 - 30 || p.x > m.x2 + 30) return;
  const rdir = p.dir === 'up' ? 'down' : p.dir === 'down' ? 'up' : p.dir;  // flipped front/back
  const f = spriteFrame(rdir);
  const h = room.spriteH * 0.62, w = h * f.sw / f.sh;
  ctx.save();
  ctx.beginPath();
  ctx.rect(m.x1, m.y1, m.x2 - m.x1, m.y2 - m.y1);
  ctx.clip();                                   // only draw inside the glass
  ctx.globalAlpha = 0.8;
  ctx.drawImage(f.img, f.sx, 0, f.sw, f.sh, Math.round(p.x - w / 2), Math.round(m.y2 - h), w, h);
  ctx.restore();
}

// ---------- main ----------
async function start() {
  try {
    await Promise.all(Object.entries(files).map(async ([k, v]) => imgs[k] = await load(v)));
  } catch (missing) {
    document.body.innerHTML = '<p style="color:#fff;font:20px monospace">Could not load: ' + missing + '</p>';
    return;
  }
  try { await document.fonts.load('36px Determination'); } catch (e) { /* falls back to monospace */ }

  VIEW_W = imgs.frisk_room.width; VIEW_H = imgs.frisk_room.height;

  // x, y = her FEET position (bottom center of the sprite), in room pixels
  p = { x: 0, y: 0, dir: 'down', moving: false, frame: 0, tick: 0 };
  enterRoom('frisk', 434, 549, 'down');

  function update() {
    if (fade) {
      p.moving = false; p.frame = 0; p.tick = 0;
      fade.t++;
      if (fade.phase === 'out' && fade.t >= FADE_FRAMES) {
        const e = fade.exit;
        enterRoom(e.to, e.x, e.y, e.dir);
        fade = { phase: 'in', t: 0 };
      } else if (fade.phase === 'in' && fade.t >= FADE_FRAMES) {
        fade = null;
      }
      return;
    }

    if (dialog) {
      p.moving = false; p.frame = 0; p.tick = 0;
      if (dialog.shown < dialog.total && ++dialog.tick >= TEXT_TICKS) {
        dialog.tick = 0; dialog.shown++;
      }
      return;
    }

    let dx = 0, dy = 0;
    if (keys.ArrowLeft  || keys.a) { dx -= 1; p.dir = 'left'; }
    if (keys.ArrowRight || keys.d) { dx += 1; p.dir = 'right'; }
    if (keys.ArrowUp    || keys.w) { dy -= 1; p.dir = 'up'; }
    if (keys.ArrowDown  || keys.s) { dy += 1; p.dir = 'down'; }

    p.moving = dx !== 0 || dy !== 0;
    if (p.moving) {
      const len = Math.hypot(dx, dy);
      const nx = p.x + (dx / len) * SPEED;
      const ny = p.y + (dy / len) * SPEED;
      if (canStand(nx, p.y)) p.x = nx;   // each axis separately so she slides along walls
      if (canStand(p.x, ny)) p.y = ny;
      if (++p.tick >= FRAME_TICKS) { p.tick = 0; p.frame = (p.frame + 1) % 4; }

      const ex = room.exits.find(e => inside(e, p.x, p.y));
      if (ex) {
        if (ROOMS[ex.to]) startTransition(ex);
        else {                                   // a room that isn't made yet
          p.x = ex.back.x; p.y = ex.back.y; p.dir = ex.back.dir;
          p.moving = false; p.frame = 0; p.tick = 0;
          openDialog([ex.todo]);
        }
      }
    } else {
      p.frame = 0; p.tick = 0;
    }
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // ---- the world: moved by the camera and zoomed ----
    const cam = cameraOffset();
    ctx.save();
    ctx.translate(cam.ox, cam.oy);
    ctx.scale(room.zoom, room.zoom);

    ctx.drawImage(imgs[room.img], 0, 0);
    drawReflection();

    const f = spriteFrame(p.dir);
    const h = room.spriteH, w = h * f.sw / f.sh;
    ctx.drawImage(f.img, f.sx, 0, f.sw, f.sh, Math.round(p.x - w / 2), Math.round(p.y - h), w, h);

    if (debug) {
      ctx.lineWidth = 2 / room.zoom;
      ctx.strokeStyle = 'lime';
      room.floor.forEach(r => ctx.strokeRect(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1));
      room.blockers.forEach(b => {
        if (b.solid === false) {
          ctx.strokeStyle = 'orange';
          ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
        } else {
          const r = padded(b);
          ctx.strokeStyle = 'red';
          ctx.strokeRect(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1);
        }
      });
      ctx.strokeStyle = 'deepskyblue';
      room.exits.forEach(r => ctx.strokeRect(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1));
      ctx.fillStyle = 'yellow';
      ctx.fillRect(p.x - FEET_HALF_W, p.y - 3, FEET_HALF_W * 2, 6);
      const hit = findInteraction();
      if (hit && lastProbe) {
        ctx.fillStyle = 'cyan'; ctx.fillRect(lastProbe.x - 4, lastProbe.y - 4, 8, 8);
      }
    }
    ctx.restore();

    // ---- the screen: not affected by the camera ----
    if (debug) {
      const hit = findInteraction();
      ctx.font = '20px monospace';
      ctx.fillStyle = '#fff';
      ctx.fillText('x:' + Math.round(p.x) + ' y:' + Math.round(p.y) +
                   (hit ? '  can interact: ' + hit.name : ''), 10, H - 14);
    }

    if (dialog) drawDialog();

    if (fade) {
      const a = fade.phase === 'out' ? fade.t / FADE_FRAMES : 1 - fade.t / FADE_FRAMES;
      ctx.fillStyle = 'rgba(0,0,0,' + clamp(a, 0, 1) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
}

window.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'b') debug = !debug;
  if ((k === 'z' || k === 'Enter') && !e.repeat) pressConfirm();
  keys[k] = true;
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
});

start();
</script>
</body>
</html>
