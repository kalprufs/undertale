function fixLines(arr) {
  return [].concat(arr).flatMap(l => wrapPages(String(l).replace(/\s*\n\s*/g, " ").replace(/^\*\s*/, "").trim()));
}
function fixAllDialogue() {
  for (const loc of Object.values(LOCATIONS)) {
    if (loc.enter) loc.enter = fixLines(loc.enter);
    for (const o of loc.interact || []) {
      if (o.lines) o.lines = fixLines(o.lines);
      if (o.cycle) o.cycle = o.cycle.map(c => fixLines(c));
    }
  }
}

function loadImg(src) {
  const img = new Image();
  img.ready = false;
  img.onload = () => (img.ready = true);
  img.onerror = () => console.warn("Could not load image:", src);
  img.src = src;
  return img;
}

for (const loc of Object.values(LOCATIONS)) {
  loc.bg = loadImg(loc.image);
  for (const ov of loc.overlays || []) ov.img = loadImg(ov.image);
}
const NPC_FRAME_TIME = 0.55;

function detectFrames(img, n, npc) {
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(img, 0, 0);
  let d;
  try { d = g.getImageData(0, 0, c.width, c.height).data; }
  catch (e) {
    console.warn("NPC " + npc.name + ": can't scan pixels on file://, using equal slots. Run from a local server / GitHub Pages for auto-detect.");
    const slots = npc.slots ?? n, w = img.width / slots;
    return { frames: Array.from({ length: n }, (_, i) => ({ sx: Math.round(i * w), sw: Math.round(w) })), top: 0, bottom: img.height - 1 };
  }
  const col = new Array(c.width).fill(false);
  let top = c.height, bottom = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    if (d[(y * c.width + x) * 4 + 3] > 10) { col[x] = true; if (y < top) top = y; if (y > bottom) bottom = y; }
  }
  if (bottom < 0) return null;
  let runs = [];
  for (let x = 0; x < c.width; x++) if (col[x]) {
    if (runs.length && runs[runs.length - 1].e === x - 1) runs[runs.length - 1].e = x; else runs.push({ s: x, e: x });
  }
  while (runs.length > n) {
    let k = 0, best = Infinity;
    for (let i = 0; i < runs.length - 1; i++) { const gap = runs[i + 1].s - runs[i].e; if (gap < best) { best = gap; k = i; } }

function updateGuide(dt) {

      else { guide.x += dx / d * step; guide.y += dy / d * step; step = 0; }
    }
    guide.t = guide.moving ? guide.t + dt : 0;
    if (!guide.path.length) { guide.moving = false; const f = guide.onArrive; guide.onArrive = null; if (f) f(); }
  } else if (guide.mode === "follow") {
    const P = { x: player.x, y: player.y }, name = locName(), tr = guide.trail, last = tr[tr.length - 1];
    if (guide.loc !== name || !last || Math.hypot(P.x - last.x, P.y - last.y) > 400) {

    if (at > 0) tr.splice(0, at);

    if (Math.hypot(dx, dy) > 0.3) { guideDir(dx, dy); guide.idle = 0; } else guide.idle += dt;

  for (const [ln, tbl] of Object.entries(ZH_TEXT)) {

    if (tbl.enter) loc.enter = pagesZh(tbl.enter);

      const t = tbl[o.name];

function update(dt) {
  if (!talk) npcClock += dt;
  updateGuide(dt);
  if (fade.state === "out") {
    fade.a += dt / FADE_TIME;
    if (fade.a >= 1) {
      fade.a = 1;
      if (fade.exit.battle) { startBattle(fade.exit.spawn); fade.state = "none"; fade.a = 0; return; }
      cur = LOCATIONS[fade.exit.to];
      const s = fade.exit.spawn || cur.spawn;
      player.x = s.x; player.y = s.y; player.dir = s.dir || "down";
      player.moving = false; player.t = 0;
      fade.state = "in";
    }
    updateCamera();
    return;
  }
  if (fade.state === "in") {
    fade.a -= dt / FADE_TIME;
    if (fade.a <= 0) {
      fade.a = 0; fade.state = "none";
      if (cur.enter && !cur.entered) { cur.entered = true; talk = { lines: cur.enter, i: 0, shown: 0 }; }
    }
    updateCamera();
    return;
  }

  if (talk) {
    talk.shown += dt * 40;
    const len = talk.lines[talk.i].length, ok = pressed.z || pressed.enter;
    if (talk.choice && talk.i === talk.lines.length - 1 && talk.shown >= len) {
      const c = talk.choice, n = c.opts.length;
      if (pressed.arrowleft || pressed.a || pressed.arrowup || pressed.w) c.sel = (c.sel + n - 1) % n;
      if (pressed.arrowright || pressed.d || pressed.arrowdown || pressed.s) c.sel = (c.sel + 1) % n;
      if (ok) { talk = null; c.cb(c.sel); }
    } else if (ok) {
      if (talk.shown < len) talk.shown = len;
      else if (++talk.i >= talk.lines.length) { const end = talk.onEnd; talk = null; if (end) end(); }
      else talk.shown = 0;
    }
    player.moving = false; player.t = 0;
    updateCamera();
    return;
  }
  if (lockInput) { player.moving = false; player.t = 0; updateCamera(); return; }
  if (invOpen) {
    const n = invItems().length;
    if (pressed.x || pressed.escape) invOpen = false;
    if (pressed.arrowup || pressed.w) invSel = (invSel + n - 1) % n;
    if (pressed.arrowdown || pressed.s) invSel = (invSel + 1) % n;
    player.moving = false; player.t = 0; updateCamera(); return;
  }
  if (pressed.x) { invOpen = true; invSel = 0; player.moving = false; player.t = 0; updateCamera(); return; }
  if (pressed.z || pressed.enter) { tryInteract(); if (talk) { updateCamera(); return; } }

  let dx = 0, dy = 0;
  if (keys["arrowleft"]  || keys["a"]) dx -= 1;
  if (keys["arrowright"] || keys["d"]) dx += 1;
  if (keys["arrowup"]    || keys["w"]) dy -= 1;
  if (keys["arrowdown"]  || keys["s"]) dy += 1;

  player.moving = false;
  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    const mx = (dx / len) * SPEED * dt;
    const my = (dy / len) * SPEED * dt;

    if (mx && canStand(player.x + mx, player.y)) { player.x += mx; player.moving = true; }
    if (my && canStand(player.x, player.y + my)) { player.y += my; player.moving = true; }

    if (dx)      player.dir = dx < 0 ? "left" : "right";
    else if (dy) player.dir = dy < 0 ? "up" : "down";
  }

  player.t = player.moving ? player.t + dt : 0;

  if (!guide.met && cur === LOCATIONS.school && player.y <= GUIDE.triggerY) { startIntro(); updateCamera(); return; }

  const fx = player.x, fy = player.y - FEET_H / 2;
  for (const ex of cur.exits) {
    if (fx >= ex.x1 && fx <= ex.x2 && fy >= ex.y1 && fy <= ex.y2 && !(ex.battle && bossDefeated)) {
      if (ex.ending) { askEnding(ex); break; }
      fade.state = "out"; fade.exit = ex;
      break;
    }
  }

  updateCamera();
}

const VIEW_MIN_W = 3000, VIEW_MIN_H = 1400;
function zoomOf(loc) {
  if (loc.zoom === "fit") return Math.min(canvas.width / loc.w, canvas.height / loc.h);
  return Math.min(loc.zoom, canvas.width / VIEW_MIN_W, canvas.height / VIEW_MIN_H);
}

function updateCamera() {
  const z = zoomOf(cur);
  const viewW = canvas.width / z, viewH = canvas.height / z;
  const cx = player.x, cy = player.y - cur.spriteH / 2;
  camX = viewW >= cur.w ? (cur.w - viewW) / 2 : Math.max(0, Math.min(cur.w - viewW, cx - viewW / 2));
  camY = viewH >= cur.h ? (cur.h - viewH) / 2 : Math.max(0, Math.min(cur.h - viewH, cy - viewH / 2));
}


function drawBand(img, b) {
  const sx = img.width / cur.w, sy = img.height / cur.h;
  ctx.drawImage(img, 0, b.y1 * sy, img.width, (b.y2 - b.y1) * sy, 0, b.y1, cur.w, b.y2 - b.y1);
}

function drawPlayer() {
  const sheet = walk[player.dir], idle = still[player.dir];
  let img, sx = 0, sw, sh;

  if (player.moving && sheet.ready) {
    img = sheet; sw = sheet.width / FRAMES; sh = sheet.height;
    sx = (Math.floor(player.t / FRAME_TIME) % FRAMES) * sw;
  } else if (idle.ready) {
    img = idle; sw = idle.width; sh = idle.height;
  }

  if (img) {
    const h = cur.spriteH, w = h * (sw / sh);
    ctx.drawImage(img, sx, 0, sw, sh, player.x - w / 2, player.y - h, w, h);
  }
}

function drawDebug() {
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(0,255,120,.9)";
  for (const r of cur.walkable) ctx.strokeRect(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1);
  ctx.strokeStyle = "rgba(80,160,255,.95)";
  for (const r of cur.exits) ctx.strokeRect(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1);
  ctx.strokeStyle = "rgba(255,60,60,.9)";
  for (const o of cur.blockers) ctx.strokeRect(o.x1, o.y1, o.x2 - o.x1, o.y2 - o.y1);
  for (const n of cur.npcs || []) { const o = npcBox(n); ctx.strokeRect(o.x1, o.y1, o.x2 - o.x1, o.y2 - o.y1); }
  for (const sl of cur.slants || []) {
    ctx.beginPath(); ctx.moveTo(sl.x1, sl.sum - sl.x1); ctx.lineTo(sl.x2, sl.sum - sl.x2); ctx.stroke();
  }
  ctx.strokeStyle = "rgba(200,80,255,.95)";
  for (const ov of cur.overlays || []) for (const b of ov.bands)
    if (b.zone) ctx.strokeRect(b.zone.x1, b.zone.y1, b.zone.x2 - b.zone.x1, b.zone.y2 - b.zone.y1);
  ctx.strokeStyle = "rgba(255,160,0,.95)";
  for (const o of cur.interact || []) ctx.strokeRect(o.x1, o.y1, o.x2 - o.x1, o.y2 - o.y1);
  ctx.strokeStyle = "yellow";
  ctx.strokeRect(player.x - FEET_W / 2, player.y - FEET_H, FEET_W, FEET_H);
}

function drawInventory() {
  const W = canvas.width, H = canvas.height, s = Math.min(W / 640, H / 480), items = invItems();
  const bw = 440 * s, rowH = 38 * s, bh = (96 + items.length * 38) * s;
  const bx = (W - bw) / 2, by = (H - bh) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#000"; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 5 * s; ctx.strokeRect(bx, by, bw, bh);
  ctx.textBaseline = "top"; ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.direction = "ltr";
  ctx.font = `${26 * s}px DeterminationMono, ZLabsPixel, 'Courier New', monospace`;
  ctx.fillText(L("INVENTORY", "背包"), bx + 24 * s, by + 18 * s);
  ctx.textAlign = "right"; ctx.direction = "rtl";
  items.forEach((it, i) => {
    const y = by + (66 * s) + i * rowH, on = i === invSel;
    ctx.font = `${10 * s}px ${INV_FONT}`;
    ctx.fillStyle = on ? "#ff0" : "#fff";
    ctx.fillText(it.fa, bx + bw - 56 * s, y);
    if (on) heart(bx + bw - 30 * s, y + 14 * s, 8 * s, "#f00");
  });
  ctx.direction = "ltr"; ctx.textAlign = "left"; ctx.fillStyle = "#888";
  ctx.font = `${18 * s}px DeterminationMono, ZLabsPixel, 'Courier New', monospace`;
  ctx.fillText(L("X: close", "X：关闭"), bx + 24 * s, by + bh - 28 * s);
}

function drawDialogue() {
  const W = canvas.width, H = canvas.height, s = Math.min(W / 640, H / 480);
  const lastPage = talk.i === talk.lines.length - 1, vert = !!(talk.choice && talk.choice.vertical && lastPage);
  const bw = 576 * s, bh = (vert ? 40 + (talk.lines[talk.i].split("\n").length + talk.choice.opts.length) * 32 : 130) * s;
  const bx = (W - bw) / 2, by = H - bh - 24 * s;
  ctx.fillStyle = "#000"; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 5 * s; ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = "#fff";
  ctx.font = `${26 * s}px DeterminationMono, ZLabsPixel, 'Courier New', monospace`;
  ctx.textBaseline = "top"; ctx.textAlign = "left";
  const full = talk.lines[talk.i];
  const rtl = /[\u0600-\u06ff]/.test(full), mainFont = ctx.font;
  if (rtl) { ctx.font = `${24 * s}px ${INV_FONT}`; ctx.direction = "rtl"; ctx.textAlign = "right"; }
  full.slice(0, talk.shown | 0).split("\n")
    .forEach((l, i) => ctx.fillText(l, rtl ? bx + bw - 20 * s : bx + 20 * s, by + 20 * s + i * 32 * s));
  if (rtl) { ctx.font = mainFont; ctx.direction = "ltr"; ctx.textAlign = "left"; }
  if (talk.choice && talk.i === talk.lines.length - 1 && talk.shown >= full.length) {
    const rows = full.split("\n").length, y = by + 20 * s + rows * 32 * s;
    talk.choice.opts.forEach((o, k) => {
      const x = bx + (vert ? 70 : 90 + k * 180) * s, yy = vert ? y + k * 32 * s : y;
      ctx.fillStyle = "#fff"; ctx.fillText(o, x, yy);
      if (k === talk.choice.sel) heart(x - 24 * s, yy + 13 * s, 8 * s, "#f00");
    });
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const z = zoomOf(cur);
  ctx.setTransform(z, 0, 0, z, -camX * z, -camY * z);

  if (cur.bg.ready) {
    ctx.drawImage(cur.bg, 0, 0, cur.w, cur.h);
  } else {
    ctx.fillStyle = "#222"; ctx.fillRect(0, 0, cur.w, cur.h);
    ctx.fillStyle = "#555";
    for (const r of walkAreas()) ctx.fillRect(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1);
  }

  const bandsList = [];
  for (const ov of cur.overlays || []) {
    if (!ov.img || !ov.img.ready) continue;
    for (const b of ov.bands) bandsList.push({ img: ov.img, b, done: false });
  }
  const actors = [{ y: player.y, draw: drawPlayer }];
  for (const n of cur.npcs || []) actors.push({ y: n.y, draw: () => drawNpc(n, npcClock) });
  const inZone = (e, y) => e.b.zone && y >= e.b.zone.y1 && y <= e.b.zone.y2;
  for (const e of bandsList) {
    if (!actors.some(a => inZone(e, a.y))) { drawBand(e.img, e.b); e.done = true; }
  }
  if ((guide.mode === "scripted" || guide.mode === "follow") && guide.loc === locName()) actors.push({ y: guide.y, draw: drawGuide });
  actors.sort((a, b) => a.y - b.y);
  actors.forEach((a, i) => {
    a.draw();
    for (const e of bandsList) {
      if (e.done || !inZone(e, a.y)) continue;
      if (!actors.slice(i + 1).some(o => inZone(e, o.y))) { drawBand(e.img, e.b); e.done = true; }
    }
  });
  if (debug) drawDebug();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (debug) {
    ctx.fillStyle = "#fff"; ctx.font = "16px monospace";
    ctx.fillText(`x:${player.x.toFixed(1)} y:${player.y.toFixed(1)}  (G = debug)`, 12, 24);
  }
  if (invOpen) drawInventory();
  if (talk) drawDialogue();
  if (nameTyping) drawNameEntry();
  if (fade.a > 0) {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(1, fade.a)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function startBattle(back) {
  B = { back, php: PMAX, bhp: BOSS.hp, phase: "menu", sel: 0, sub: [], subSel: 0, text: BOSS.encounter,
        shown: 0, t: 0, bar: 0, timer: 0, dmg: 0, bullets: [], hx: 320, hy: 325, inv: 0, turn: 0,
        calm: false, items: 2, spawnT: 0, won: false, next: "menu" };

function endBattle() {
  if (B.won) bossDefeated = true;
  const s = B.back;
  player.x = s.x; player.y = s.y; player.dir = s.dir || "down"; player.moving = false; player.t = 0;

function say(text, next) { B.text = text; B.shown = 0; B.phase = "say"; B.next = next || "dodge"; }
function toMenu() { B.phase = "menu"; B.text = BOSS.flavor[B.turn % BOSS.flavor.length]; B.shown = 0; }
function startDodge() { B.phase = "dodge"; B.timer = 6; B.bullets = []; B.spawnT = 0; B.hx = 320; B.hy = 325; B.inv = 0; }

function updateBattle(dt) {
  B.t += dt; B.shown += dt * 40; B.inv = Math.max(0, B.inv - dt);
  const L = pressed.arrowleft || pressed.a, R = pressed.arrowright || pressed.d;
  const U = pressed.arrowup || pressed.w,   D = pressed.arrowdown || pressed.s;
  const ok = pressed.z || pressed.enter, back = pressed.x, ph = B.phase;

  if (ph === "menu") {
    if (L) B.sel = (B.sel + 3) % 4;
    if (R) B.sel = (B.sel + 1) % 4;
    if (ok) {
      if (B.sel === 0) { B.phase = "attack"; B.bar = 0; }
      else {
        B.sub = [["Check", "Talk"], B.items > 0 ? ["Bandage x" + B.items] : [], ["Spare"]][B.sel - 1];
        B.subSel = 0;
        if (B.sub.length) B.phase = "sub"; else say(L("* You have no items.", "* 你没有物品了。"), "menu");
      }
    }
  } else if (ph === "sub") {
    if (U) B.subSel = (B.subSel + B.sub.length - 1) % B.sub.length;
    if (D) B.subSel = (B.subSel + 1) % B.sub.length;
    if (back) B.phase = "menu";
    if (ok) {
      const c = B.sub[B.subSel];
      if (c === "Check") say(BOSS.check);
      else if (c === "Talk") { B.calm = true; say(BOSS.talk); }
      else if (c.startsWith("Bandage")) { B.items--; B.php = Math.min(PMAX, B.php + 10); say(L("* You used a Bandage.\n* HP restored.", "* 你使用了绷带。\n* HP 已恢复。")); }
      else if (B.calm || B.bhp <= BOSS.hp * 0.3) { B.won = true; say(BOSS.spare, "end"); }
      else say(BOSS.notReady);
    }
  } else if (ph === "say") {
    if (ok) {
      if (B.shown < B.text.length) B.shown = 999;
      else if (B.next === "end") endBattle();
      else if (B.next === "menu") toMenu();
      else startDodge();
    }
  } else if (ph === "attack") {
    B.bar += 520 * dt;
    if (ok || B.bar > 536) {
      B.dmg = B.bar > 536 ? 0 : Math.round(40 * (1 - Math.abs(B.bar - 268) / 268));
      B.bhp = Math.max(0, B.bhp - B.dmg); B.timer = 1.2; B.phase = "hit";
    }
  } else if (ph === "hit") {
    B.timer -= dt;
    if (B.timer <= 0) { if (B.bhp <= 0) { B.won = true; say(BOSS.win, "end"); } else startDodge(); }
  } else if (ph === "dodge") {
    B.timer -= dt; B.spawnT -= dt;
    const mx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
    const my = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
    B.hx = Math.max(232, Math.min(408, B.hx + mx * 200 * dt));
    B.hy = Math.max(272, Math.min(378, B.hy + my * 200 * dt));
    if (B.spawnT <= 0) {
      B.spawnT = 0.35;
      if (B.turn % 2 === 0) B.bullets.push({ x: 226 + Math.random() * 180, y: 255, w: 14, h: 20, vx: 0, vy: 170 });
      else { const l = Math.random() < 0.5; B.bullets.push({ x: l ? 215 : 420, y: 275 + Math.random() * 100, w: 20, h: 14, vx: l ? 200 : -200, vy: 0 }); }
    }
    for (const b of B.bullets) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (B.inv <= 0 && Math.abs(b.x + b.w / 2 - B.hx) < b.w / 2 + 6 && Math.abs(b.y + b.h / 2 - B.hy) < b.h / 2 + 6) { B.php -= BOSS.atk; B.inv = 1; }
    }
    B.bullets = B.bullets.filter(b => b.x > 200 && b.x < 440 && b.y < 400);
    if (B.php <= 0) { B.phase = "dead"; B.text = L("GAME OVER\n* Press Z", "游戏结束\n* 按 Z 键"); B.shown = 999; }
    else if (B.timer <= 0) { B.turn++; toMenu(); }
  } else if (ph === "dead") {
    if (ok) endBattle();
  }
}

function heart(x, y, s, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.2, y + s * 0.1, x - s * 0.5, y - s * 0.6, x, y - s * 0.1);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 0.6, x + s * 1.2, y + s * 0.1, x, y + s * 0.9); ctx.fill();
}

function subLabel(o) {
  return LANG !== "zh" ? o : ({ Check: "查看", Talk: "交谈", Spare: "饶恕" }[o] ?? o.replace("Bandage", "绷带"));
}
function drawBattle() {
  const W = canvas.width, H = canvas.height, s = Math.min(W / 640, H / 480);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(s, 0, 0, s, (W - 640 * s) / 2, (H - 480 * s) / 2);
  ctx.font = "26px DeterminationMono, ZLabsPixel, 'Courier New', monospace"; ctx.textBaseline = "top"; ctx.textAlign = "left";
  const ph = B.phase, dodge = ph === "dodge";

  if (!B.won) {
    const h = BOSS.h, w = bossImg.ready ? h * bossImg.width / bossImg.height : h;
    const sx = ph === "hit" ? Math.sin(B.t * 60) * 8 * Math.min(1, B.timer) : 0, y = 30 + Math.sin(B.t * 2) * 6;
    if (bossImg.ready) ctx.drawImage(bossImg, 320 - w / 2 + sx, y, w, h);
    else { ctx.fillStyle = "#fff"; ctx.fillRect(320 - w / 2, y, w, h); }
  }
  if (ph === "hit") {
    ctx.fillStyle = "#555"; ctx.fillRect(220, 8, 200, 14);
    ctx.fillStyle = "#0f0"; ctx.fillRect(220, 8, 200 * B.bhp / BOSS.hp, 14);
    ctx.fillStyle = "#f33"; ctx.textAlign = "center"; ctx.fillText(B.dmg ? B.dmg : "MISS", 320, 40); ctx.textAlign = "left";
  }

  const bx = dodge ? 220 : 32, bw = dodge ? 200 : 576;
  ctx.fillStyle = "#000"; ctx.fillRect(bx, 260, bw, 130);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 5; ctx.strokeRect(bx, 260, bw, 130);
  ctx.fillStyle = "#fff";
  const lines = t => String(t).split("\n").forEach((l, i) => ctx.fillText(l, 52, 282 + i * 32));
  if (ph === "menu" || ph === "say" || ph === "dead") lines(B.text.slice(0, B.shown | 0));
  if (ph === "sub") B.sub.forEach((o, i) => { ctx.fillText(subLabel(o), 92, 282 + i * 32); if (i === B.subSel) heart(70, 295 + i * 32, 8, "#f00"); });
  if (ph === "attack" || ph === "hit") {
    ctx.lineWidth = 3; ctx.strokeRect(52, 290, 536, 70);
    ctx.beginPath(); ctx.moveTo(320, 290); ctx.lineTo(320, 360); ctx.stroke();
    ctx.fillRect(52 + B.bar - 4, 285, 8, 80);
  }
  if (dodge) {
    ctx.save(); ctx.beginPath(); ctx.rect(222, 262, 196, 126); ctx.clip();
    for (const b of B.bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.restore();
    if (B.inv <= 0 || ((B.t * 20) | 0) % 2) heart(B.hx, B.hy, 10, "#f00");
  }

  ctx.fillStyle = "#fff"; ctx.fillText("CHARA  LV 1", 32, 398); ctx.fillText("HP", 300, 398);
  ctx.fillStyle = "#c00"; ctx.fillRect(345, 398, 100, 22);
  ctx.fillStyle = "#ff0"; ctx.fillRect(345, 398, 100 * Math.max(0, B.php) / PMAX, 22);
  ctx.fillStyle = "#fff"; ctx.fillText(Math.max(0, B.php) + " / " + PMAX, 460, 398);
  L(["FIGHT", "ACT", "ITEM", "MERCY"], ["战斗", "行动", "物品", "饶恕"]).forEach((n, i) => {
    const x = 32 + i * 150, on = ph === "menu" && B.sel === i;
    ctx.strokeStyle = ctx.fillStyle = on ? "#ff0" : "#f80"; ctx.lineWidth = 4;
    ctx.strokeRect(x, 435, 125, 40); ctx.fillText(n, x + 30, 442);
    if (on) heart(x + 18, 455, 8, "#f00");
  });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (fade.a > 0) { ctx.fillStyle = `rgba(0,0,0,${fade.a})`; ctx.fillRect(0, 0, W, H); }
}

let CREDITS = [
  "#Code", "扎因 Zeinab Ghalavand (Amoo)", "",
  "#Art and design", "蓝灵 Hadis Kamali Arya (Khale)", "扎因 Zeinab Ghalavand (Amoo)", "",
  "#Writing", "沈笑娴 Tabassom Alikhani (Toranj)", "扎因 Zeinab Ghalavand (Amoo)", "英春伶 Bahar KhodaBakhsh (Lamine)", "佳馨雅 Maryam AhmadNejad (Xinberry)", "",
  "#Translation", "米怡人 Sarvin Ghaemi (Malake)", "沈笑娴 Tabassom Alikhani (Toranj)", "扎因 Zeinab Ghalavand (Amoo)", "",
  "#With guidance of", "谢夏珩 博士 Dr. Xie Xiaheng",
];
const CREDITS_ZH = [
  "#代码", "扎因 Zeinab Ghalavand (Amoo)", "",
  "#美术与设计", "蓝灵 Hadis Kamali Arya (Khale)", "扎因 Zeinab Ghalavand (Amoo)", "",
  "#文案", "沈笑娴 Tabassom Alikhani (Toranj)", "扎因 Zeinab Ghalavand (Amoo)", "英春伶 Bahar KhodaBakhsh (Lamine)", "佳馨雅 Maryam AhmadNejad (Xinberry)", "",
  "#翻译", "米怡人 Sarvin Ghaemi (Malake)", "沈笑娴 Tabassom Alikhani (Toranj)", "扎因 Zeinab Ghalavand (Amoo)", "",
  "#指导老师", "谢夏珩 博士 Dr. Xie Xiaheng",
];
let endPhase = 0, credY = 0;

function drawEnd(dt) {
  endT += dt;
  const W = canvas.width, H = canvas.height, s = Math.min(W / 640, H / 480);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "middle"; ctx.textAlign = "center"; ctx.direction = "ltr";
  const font = px => `${px * s}px DeterminationMono, ZLabsPixel, 'Courier New', monospace`;
  if (endPhase === 0) {
    ctx.globalAlpha = Math.min(1, endT / 1.5); ctx.fillStyle = "#fff";
    ctx.font = font(48); ctx.fillText(L("THE END", "完"), W / 2, H * 0.14);
    ctx.font = font(22);
    const endText = L("We are really glad you're here. This faculty is truly unique. It's full of different people, and everyone is unique in their own way. And I know you are too. We can't wait to get to know you. If you have any questions, please ask us. We've been there. We know.", "我们真的很高兴你来到这里。这个学院真的很特别。这里有各种各样的人，每个人都以自己的方式独一无二。我知道你也是。我们迫不及待想认识你。如果你有任何问题，请随时问我们。我们都经历过，我们懂。");
    const endLines = []; let ln = "";
    if (LANG === "zh") endLines.push(...zhBreak(endText, 24));
    else {
      for (const w of endText.split(" ")) { if ((ln + w).length > 38) { endLines.push(ln.trim()); ln = ""; } ln += w + " "; }
      endLines.push(ln.trim());
    }
    endLines.forEach((t, i) => ctx.fillText(t, W / 2, H * 0.3 + i * 32 * s));
    ctx.globalAlpha = 1;
    if (endT > 3) {
      ctx.fillStyle = "#888"; ctx.font = font(18);
      ctx.fillText(touchOn ? L("tap Z for credits", "点按 Z 查看制作名单") : L("press Z for credits", "按 Z 键查看制作名单"), W / 2, H * 0.93);
      if (pressed.z || pressed.enter) { endPhase = 1; credY = H + 20 * s; }
    }
  } else {
    credY -= 45 * s * dt;
    const lineH = 34 * s, lastY = credY + (CREDITS.length - 1) * lineH;
    if (lastY < H * 0.55) credY += (H * 0.55 - lastY);
    ctx.font = font(22);
    CREDITS.forEach((t, i) => {
      if (!t) return;
      const head = t[0] === "#";
      ctx.fillStyle = head ? "#ff0" : "#fff";
      ctx.fillText(head ? t.slice(1) : t, W / 2, credY + i * lineH);
    });
  }
}


const tracks = {};
for (const [k, src] of Object.entries(MUSIC)) {
  if (!src) continue;
  const a = new Audio(src);
  a.loop = true; a.preload = "auto"; a.volume = 0;
  a.onerror = () => console.warn("Could not load music:", src);
  tracks[k] = a;
}
let musicOn = false, wantTrack = null;
addEventListener("keydown", () => (musicOn = true));
addEventListener("pointerdown", () => (musicOn = true));

function updateMusic(dt) {
  const want = mode === "battle" ? "boss"
             : mode === "end"    ? "end"
             : Object.keys(LOCATIONS).find(k => LOCATIONS[k] === cur);
  if (want !== wantTrack) {
    wantTrack = want;
    if (tracks[want] && (want === "boss" || want === "end")) tracks[want].currentTime = 0;
  }
  const step = MUSIC_VOLUME * dt / MUSIC_FADE;
  for (const [k, a] of Object.entries(tracks)) {
    if (a.error) continue;
    if (k === wantTrack && musicOn) {
      if (a.paused) a.play().catch(() => {});
      a.volume = Math.min(MUSIC_VOLUME, a.volume + step);
    } else if (!a.paused) {
      a.volume = Math.max(0, a.volume - step);
      if (a.volume === 0) a.pause();
    }
  }
}


let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  updateMusic(dt);
  if (mode === "battle") { updateBattle(dt); drawBattle(); }
  else if (mode === "end") drawEnd(dt);
  else { update(dt); draw(); }
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
